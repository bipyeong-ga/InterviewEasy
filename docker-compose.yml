version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: intervieweasy-db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: interview
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d interview"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      target: server-prod
    container_name: intervieweasy-server
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=user
      - DB_PASSWORD=1234
      - DB_NAME=interview
      - JWT_SECRET=your_jwt_secret_here
      - JWT_EXPIRES_IN_SECS=604800
      - JWT_ISSUER=intervieweasy
      # Change FRONTEND_URL and CORS_ORIGIN to the EC2 domain/IP later if needed
      - FRONTEND_URL=http://localhost
      - CORS_ORIGIN=http://localhost
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy

  client:
    build:
      context: .
      target: client-prod
    container_name: intervieweasy-client
    environment:
      - NODE_ENV=production
    depends_on:
      - server

  nginx:
    image: nginx:alpine
    container_name: intervieweasy-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - client
      - server

volumes:
  postgres_data:
