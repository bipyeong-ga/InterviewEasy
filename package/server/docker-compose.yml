services:
    db:
        image: postgres:latest
        container_name: postgres-container
        restart: always
        environment:
            POSTGRES_USER: user
            POSTGRES_PASSWORD: 1234
            POSTGRES_DB: interview
        ports:
            - "5432:5432"
        volumes:
            - postgres-data:/var/lib/postgresql

    server:
        build: .
        container_name: server-container
        restart: always
        ports:
            - "3000:3000"
        environment:
            DB_HOST: db
            DB_PORT: 5432
            DB_USER: user
            DB_PASSWORD: 1234
            DB_NAME: interview
            PORT: 3000
            NODE_ENV: development
            JWT_SECRET: change-me-in-dev
            CORS_ORIGIN: http://localhost:5173
        depends_on:
            db:
                condition: service_started
        volumes:
            - ./src:/app/src
            - /app/node_modules

volumes:
    postgres-data: {}
